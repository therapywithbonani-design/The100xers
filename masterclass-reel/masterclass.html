<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Poppins:wght@400;500;600;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,TAU=Math.PI*2;
const CREAM='#f7f1e6',GREEN='#1f5a2e',GREEN2='#2e7d3a',ORANGE='#ee7a22',DARK='#22301f';
const main=document.getElementById('c');let x=main.getContext('2d');
const OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),prog=(t,s,d)=>clamp((t-s)/d),lerp=(a,b,p)=>a+(b-a)*p;
const eOut=p=>1-Math.pow(1-p,3),eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const IMG={};const load=(k,s)=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.src=s});

/* ---------- helpers ---------- */
function cover(img,X,Y,w,h,zoom=1,px=0,py=0){
  const s=Math.max(w/img.width,h/img.height)*zoom,dw=img.width*s,dh=img.height*s;
  x.drawImage(img,X+(w-dw)/2+px*(dw-w)/2,Y+(h-dh)/2+py*(dh-h)/2,dw,dh);
}
function blurBg(img,zoom,tint,ta){
  x.save();x.filter='blur(34px)';cover(img,-60,-60,W+120,H+120,zoom);x.restore();
  x.fillStyle=tint;x.globalAlpha=ta;x.fillRect(0,0,W,H);x.globalAlpha=1;
}
function photoCard(img,cx,cy,w,h,zoom,px,py,a=1,dy=0,border=14){
  if(a<=0)return;x.save();x.globalAlpha=a;x.translate(0,dy);
  x.shadowColor='rgba(40,30,10,.35)';x.shadowBlur=50;x.shadowOffsetY=22;
  x.fillStyle='#fff';x.beginPath();x.roundRect(cx-w/2-border,cy-h/2-border,w+2*border,h+2*border,30);x.fill();
  x.shadowColor='transparent';x.save();x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,20);x.clip();
  cover(img,cx-w/2,cy-h/2,w,h,zoom,px,py);x.restore();x.restore();
}
function up(t,s,d=.8){const p=eOut(prog(t,s,d));return{a:p,dy:(1-p)*40}}
function T(s,X,Y,size,color,o={}){
  const a=o.a??1;if(a<=0)return;x.save();x.globalAlpha=a;
  const fam=o.font==='serif'?'"Playfair Display"':'"Poppins"';
  x.font=(o.italic?'italic ':'')+(o.weight||600)+' '+size+'px '+fam;try{x.letterSpacing=(o.ls||0)+'px'}catch(e){}
  x.textAlign=o.align||'center';x.textBaseline='middle';
  if(o.shadow){x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=24;x.shadowOffsetY=4}
  x.fillStyle=color;x.fillText(s,X,Y+(o.dy||0));x.restore();
}
function pill(s,X,Y,size,fg,bg,a=1,dy=0,ls=1){
  if(a<=0)return;x.save();x.globalAlpha=a;x.font='600 '+size+'px "Poppins"';try{x.letterSpacing=ls+'px'}catch(e){}
  const w=x.measureText(s).width+size*1.4,h=size*1.9;
  x.fillStyle=bg;x.beginPath();x.roundRect(X-w/2,Y-h/2+dy,w,h,h/2);x.fill();
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(s,X,Y+dy+2);x.restore();
}
function line(X1,X2,Y,p,col,w=4){if(p<=0)return;x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';const m=(X1+X2)/2,h=(X2-X1)/2*p;x.beginPath();x.moveTo(m-h,Y);x.lineTo(m+h,Y);x.stroke()}
function logoCard(cx,cy,w,a,dy){
  if(a<=0)return;const lg=IMG.logo,lw=w-80,lh=lw*lg.height/lg.width,h=lh+70;
  x.save();x.globalAlpha=a;x.translate(0,dy);x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=30;x.shadowOffsetY=10;
  x.fillStyle='#fff';x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,28);x.fill();x.shadowColor='transparent';
  x.drawImage(lg,cx-lw/2,cy-lh/2,lw,lh);x.restore();
}
/* line icons */
function icon(kind,cx,cy,r,p,slash){
  x.save();x.translate(cx,cy);x.strokeStyle=GREEN2;x.lineWidth=7;x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.arc(0,0,r,0,TAU);x.stroke();x.lineWidth=6;
  if(kind==='drop'){x.beginPath();x.moveTo(0,-42);x.bezierCurveTo(14,-20,30,-2,30,14);x.arc(0,14,30,0,Math.PI);x.bezierCurveTo(-30,-2,-14,-20,0,-42);x.stroke()}
  if(kind==='cubes'){[[-22,8],[22,8],[0,-28]].forEach(([a,b])=>{x.strokeRect(a-18,b-18,36,36)})}
  if(kind==='wheat'){x.beginPath();x.moveTo(0,46);x.lineTo(0,-40);x.stroke();for(let i=0;i<4;i++){const yy=-30+i*18;[-1,1].forEach(d=>{x.beginPath();x.ellipse(d*12,yy,7,13,d*.6,0,TAU);x.stroke()})}}
  if(kind==='leaf'){[-1,1].forEach(d=>{x.save();x.scale(d,1);x.beginPath();x.moveTo(2,30);x.quadraticCurveTo(0,-20,42,-36);x.quadraticCurveTo(46,16,2,30);x.stroke();x.restore()});x.beginPath();x.moveTo(0,46);x.lineTo(0,28);x.stroke()}
  if(slash&&p>0){x.strokeStyle='#c8442e';x.lineWidth=8;const k=r*.7;x.beginPath();x.moveTo(-k,k);x.lineTo(-k+2*k*p,k-2*k*p);x.stroke()}
  x.restore();
}
function phoneIcon(cx,cy,s,col){
  x.save();x.translate(cx,cy);x.scale(s,s);x.rotate(-.6);x.fillStyle=col;
  x.beginPath();x.roundRect(-14,-38,28,24,8);x.fill();x.beginPath();x.roundRect(-14,14,28,24,8);x.fill();
  x.strokeStyle=col;x.lineWidth=12;x.lineCap='round';x.beginPath();x.moveTo(-12,-24);x.quadraticCurveTo(-30,0,-12,24);x.stroke();x.restore();
}
function pin(cx,cy,s,col){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle=col;x.beginPath();x.arc(0,-10,18,Math.PI,0);x.lineTo(0,26);x.closePath();x.fill();x.fillStyle=GREEN;x.beginPath();x.arc(0,-10,7,0,TAU);x.fill();x.restore()}
function clock(cx,cy,r,col){x.save();x.strokeStyle=col;x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(cx,cy,r,0,TAU);x.stroke();x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy-r*.6);x.moveTo(cx,cy);x.lineTo(cx+r*.45,cy+r*.2);x.stroke();x.restore()}


function mixT(parts,X,Y,size,color,o={}){const a=o.a??1;if(a<=0)return;x.save();x.globalAlpha=a;x.textBaseline='middle';x.textAlign='left';try{x.letterSpacing='0px'}catch(e){}
  const F=p=>p[1]?'700 '+size*.92+'px "Poppins"':'800 '+size+'px "Playfair Display"';
  let w=0;parts.forEach(p=>{x.font=F(p);w+=x.measureText(p[0]).width});let sx=X-w/2;
  parts.forEach(p=>{x.font=F(p);x.fillStyle=color;x.fillText(p[0],sx,Y+(o.dy||0)+(p[1]?size*.04:0));sx+=x.measureText(p[0]).width});x.restore()}
function clockLine(s,cy,size,col,iconCol,a,dy,weight=600){if(a<=0)return;x.save();x.font=weight+' '+size+'px "Poppins"';const w=x.measureText(s).width;x.restore();
  const total=w+size*1.3,left=540-total/2;x.save();x.globalAlpha=a;clock(left+size*.45,cy+dy,size*.45,iconCol);x.restore();
  T(s,left+size*1.3,cy+3,size,col,{weight,align:'left',a,dy})}

/* ---------- scenes (absolute time t) ---------- */
function s1(t){
  const seq=[['momos',0],['dal',1.55],['halwa',3.1]];let cur=0;seq.forEach((s,i)=>{if(t>=s[1])cur=i});
  blurBg(IMG[seq[cur][0]],1.1,'#1b140c',.55);
  const v=x.createLinearGradient(0,1000,0,H);v.addColorStop(0,'rgba(15,10,5,0)');v.addColorStop(1,'rgba(15,10,5,.6)');x.fillStyle=v;x.fillRect(0,0,W,H);
  const p0=up(t,.1);pill('PBW FOODS PRESENTS',540,270,36,'#fff',ORANGE,p0.a,p0.dy,4);
  seq.forEach(([k,st],i)=>{const a=i===0?1:eio(prog(t,st,.45));if(t<st)return;const lt=t-st;
    photoCard(IMG[k],540,800,920,620,1.02+lt*.035,i%2?.4-lt*.15:-.4+lt*.15,0,a,0)});
  let a=up(t,.35);T('Love momos,',540,1260,104,'#fff',{font:'serif',weight:800,a:a.a,dy:a.dy,shadow:1});
  a=up(t,1.6);T('dal & halwa?',540,1385,104,'#ffcf8f',{font:'serif',weight:800,italic:1,a:a.a,dy:a.dy,shadow:1});
  a=up(t,3.2);T('Learn to cook them the healthy way.',540,1525,46,'#fff',{weight:500,a:a.a,dy:a.dy,shadow:1});
}
function s2(t){const t0=4.6;
  x.fillStyle=CREAM;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.16;blurBg(IMG.chef,1.2,CREAM,0);x.restore();
  let a=up(t,t0+.1);logoCard(540,230,600,a.a,a.dy);
  a=up(t,t0+.4);pill('PLANT-BASED COOKING MASTERCLASS',540,420,38,'#fff',ORANGE,a.a,a.dy,2);
  [[[['3',1],[' Saturdays.',0]],560,.7],[[['15',1],[' healthy',0]],690,1.0],[[['recipes.',0]],820,1.3]].forEach(([p,y,d])=>{a=up(t,t0+d);mixT(p,540,y,118,GREEN,{a:a.a,dy:a.dy})});
  a=up(t,t0+1.8);clockLine('Every Saturday · 11 AM – 2 PM',955,48,ORANGE,ORANGE,a.a,a.dy);
  a=up(t,t0+1.2,1);photoCard(IMG.chef,540,1320,520,578,1.04+(t-t0)*.02,0,-.3,a.a,a.dy);
}
function classScene(t,t0,o){
  x.fillStyle=CREAM;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.22;blurBg(IMG[o.img],1.2,CREAM,0);x.restore();
  let a=up(t,t0+.1);T(o.k,540,240,38,GREEN2,{weight:600,ls:8,a:a.a,dy:a.dy});line(420,660,292,eOut(prog(t,t0+.3,.8)),ORANGE,4);
  // calendar tile
  a=up(t,t0+.3);if(a.a>0){x.save();x.globalAlpha=a.a;x.translate(-(1-a.a)*60,0);
    x.shadowColor='rgba(40,30,10,.25)';x.shadowBlur=30;x.shadowOffsetY=12;x.fillStyle='#fff';x.beginPath();x.roundRect(130,350,240,270,26);x.fill();x.shadowColor='transparent';
    x.fillStyle=GREEN;x.beginPath();x.roundRect(130,350,240,74,[26,26,0,0]);x.fill();x.restore();
    T('SATURDAY',250-(1-a.a)*60,388,28,'#fff',{weight:600,ls:3,a:a.a});
    T(o.day,250-(1-a.a)*60,508,100,GREEN,{weight:700,a:a.a});
    T(o.mon,250-(1-a.a)*60,585,36,ORANGE,{weight:700,ls:4,a:a.a});}
  a=up(t,t0+.5);T(o.t1,420,425,92,GREEN,{font:'serif',weight:800,align:'left',a:a.a,dy:a.dy});
  a=up(t,t0+.7);T(o.t2,420,535,92,ORANGE,{font:'serif',weight:800,italic:1,align:'left',a:a.a,dy:a.dy});
  a=up(t,t0+1.0);T(o.desc,540,700,46,DARK,{weight:500,a:a.a,dy:a.dy});
  a=up(t,t0+.6,1);photoCard(IMG[o.img],540,1170,900,700,1.03+(t-t0)*.03,o.pan*(-.5+(t-t0)*.22),0,a.a,a.dy);
}
const s3=t=>classScene(t,9.2,{k:'CLASS 1 OF 3',day:'28',mon:'NOV',t1:'Winter',t2:'Warmth',desc:'Comforting winter recipes',img:'winter',pan:1});
const s4=t=>classScene(t,13.4,{k:'CLASS 2 OF 3',day:'5',mon:'DEC',t1:'Wholesome',t2:'Table',desc:'Hearty everyday meals',img:'wholesome',pan:-1});
const s5=t=>classScene(t,17.6,{k:'CLASS 3 OF 3',day:'12',mon:'DEC',t1:'Naturally',t2:'Sweet',desc:'Desserts with no refined sugar',img:'sweet',pan:1});
function s6(t){const t0=21.8;
  x.fillStyle=CREAM;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.18;blurBg(IMG.winter,1.3,CREAM,0);x.restore();
  let a=up(t,t0+.1);T('Every recipe is',540,300,84,DARK,{font:'serif',weight:700,a:a.a,dy:a.dy});
  a=up(t,t0+.35);T('good for you.',540,410,98,ORANGE,{font:'serif',weight:800,italic:1,a:a.a,dy:a.dy});
  const tiles=[['drop','No Oil',1],['cubes','No Refined Sugar',1],['wheat','No Maida',1],['leaf','100% Plant-Based',0]];
  tiles.forEach(([k,l,sl],i)=>{const cx=i%2?785:295,cy=i<2?720:1080,st=t0+.6+i*.35;a=up(t,st);if(a.a<=0)return;
    x.save();x.globalAlpha=a.a;x.translate(0,a.dy);x.shadowColor='rgba(40,30,10,.18)';x.shadowBlur=30;x.shadowOffsetY=10;
    x.fillStyle='#fff';x.beginPath();x.roundRect(cx-225,cy-160,450,320,28);x.fill();x.shadowColor='transparent';
    icon(k,cx,cy-45,72,eOut(prog(t,st+.4,.5)),sl);x.restore();
    T(l,cx,cy+100,l.length>12?38:44,GREEN,{weight:600,a:a.a,dy:a.dy})});
  a=up(t,t0+2.2);if(a.a>0){x.save();x.globalAlpha=a.a;x.translate(0,a.dy);x.fillStyle=ORANGE;x.beginPath();x.roundRect(150,1300,780,130,65);x.fill();x.restore();
    T('Working lunch included',540,1367+a.dy,52,'#fff',{weight:600,a:a.a})}
}
function s7(t){const t0=25.8;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#173f22');g.addColorStop(1,'#2c6a38');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.14;blurBg(IMG.sweet,1.2,'#173f22',0);x.restore();
  let a=up(t,t0+.1);logoCard(540,215,620,a.a,a.dy);
  a=up(t,t0+.3);T('Book your spot',540,410,100,'#fff',{font:'serif',weight:800,a:a.a,dy:a.dy});
  a=up(t,t0+.55);pill('First class: Saturday, 28 Nov',540,530,40,'#fff',ORANGE,a.a,a.dy,1);
  a=up(t,t0+.8);T('ALL 3 CLASSES',540,665,36,'#cfe8c8',{weight:600,ls:7,a:a.a,dy:a.dy});
  [['OFFLINE','₹3,399',300],['ONLINE','₹1,199',780]].forEach(([l,p,cx],i)=>{a=up(t,t0+1+i*.2);if(a.a<=0)return;
    x.save();x.globalAlpha=a.a;x.translate(0,a.dy);x.fillStyle='#fdf8ef';x.beginPath();x.roundRect(cx-215,720,430,210,26);x.fill();x.restore();
    T(l,cx,775,34,GREEN2,{weight:600,ls:5,a:a.a,dy:a.dy});T(p,cx,862,84,GREEN,{weight:700,a:a.a,dy:a.dy})});
  a=up(t,t0+1.5);x.save();x.globalAlpha=a.a;pin(140,1010+a.dy,1.3,'#ffcf8f');x.restore();
  T('PBW Experiential Centre',185,1005,44,'#fff',{weight:600,align:'left',a:a.a,dy:a.dy});
  T('DLF Epitome, Building 5, Gurugram',185,1065,38,'#d9ecd3',{weight:500,align:'left',a:a.a,dy:a.dy});
  a=up(t,t0+1.9);if(a.a>0){const pulse=1+Math.sin(t*5)*.015;x.save();x.globalAlpha=a.a;x.translate(540,1290+a.dy);x.scale(pulse,pulse);
    x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=40;x.shadowOffsetY=14;x.fillStyle='#fff';x.beginPath();x.roundRect(-460,-105,920,210,105);x.fill();x.shadowColor='transparent';
    for(let k=0;k<2;k++){const rp=((t*0.9+k*.5)%1);x.strokeStyle='rgba(238,122,34,'+(1-rp)*.6+')';x.lineWidth=5;x.beginPath();x.arc(-345,0,62+rp*40,0,TAU);x.stroke()}
    x.fillStyle=ORANGE;x.beginPath();x.arc(-345,0,62,0,TAU);x.fill();phoneIcon(-345,0,1.25,'#fff');x.restore();
    T('CALL TO BOOK',300,1250+a.dy,32,ORANGE,{weight:600,ls:5,align:'left',a:a.a});
    T('+91 98715 24376',300,1318+a.dy,66,GREEN,{weight:700,align:'left',a:a.a})}
  a=up(t,t0+2.3);clockLine('Every Saturday · 11 AM – 2 PM',1475,44,'#fff','#ffcf8f',a.a,a.dy,500);
}
/* ---------- compositor ---------- */
const SC=[[0,s1],[4.6,s2],[9.2,s3],[13.4,s4],[17.6,s5],[21.8,s6],[25.8,s7]],FADE=.6;
const GR=document.createElement('canvas');GR.width=GR.height=512;{const g=GR.getContext('2d'),d=g.createImageData(512,512);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)}
function render(t){
  let i=0;SC.forEach((s,k)=>{if(t>=s[0])i=k});
  x=main.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;
  if(i>0&&t-SC[i][0]<FADE){SC[i-1][1](t);const og=OFF.getContext('2d');x=og;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.clearRect(0,0,W,H);SC[i][1](t);
    x=main.getContext('2d');x.globalAlpha=eio((t-SC[i][0])/FADE);x.drawImage(OFF,0,0);x.globalAlpha=1}
  else SC[i][1](t);
  // film grain + soft vignette
  x.save();x.globalAlpha=.045;x.globalCompositeOperation='overlay';const ox=Math.floor(Math.random()*512),oy=Math.floor(Math.random()*512);
  for(let yy=-oy;yy<H;yy+=512)for(let xx=-ox;xx<W;xx+=512)x.drawImage(GR,xx,yy);x.restore();
  const v=x.createRadialGradient(540,960,700,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(30,20,5,.22)');x.fillStyle=v;x.fillRect(0,0,W,H);
}
window.render=render;
window.ready=document.fonts.ready.then(()=>Promise.all([
  document.fonts.load('800 100px "Playfair Display"'),document.fonts.load('italic 800 100px "Playfair Display"'),document.fonts.load('700 100px "Playfair Display"'),
  document.fonts.load('500 40px "Poppins"'),document.fonts.load('600 40px "Poppins"'),document.fonts.load('700 40px "Poppins"'),
  ...['chef','winter','wholesome','sweet','momos','dal','halwa'].map(k=>load(k,'assets/'+k+'.jpg')),load('logo','assets/pbw-logo.png')])).then(()=>{render(0);return true});
</script>
